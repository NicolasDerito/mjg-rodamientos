<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101714">
  <meta name="robots" content="noindex, nofollow">
  <title>Estamos trabajando para usted | MJG Rodamientos</title>
  <meta name="description" content="Estamos realizando mejoras en nuestro sitio. Pronto estaremos nuevamente en línea.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root{color-scheme:dark;--ink:#f6f5ef;--muted:#adb8b2;--accent:#d0a15d;--bg:#101714;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
    body{min-height:100vh;background:radial-gradient(ellipse at 75% 15%,rgba(47,70,57,.54),transparent 40%),linear-gradient(135deg,#101714,#18231c 65%,#111815);color:var(--ink);display:grid;place-items:center;padding:32px;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(90deg,transparent 49.8%,var(--line) 50%,transparent 50.2%),linear-gradient(transparent 49.8%,var(--line) 50%,transparent 50.2%);background-size:96px 96px;mask-image:linear-gradient(115deg,transparent 20%,black 100%)}
    .card{position:relative;width:min(100%,940px);min-height:530px;display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line);background:rgba(13,19,16,.72);box-shadow:0 32px 90px rgba(0,0,0,.32);backdrop-filter:blur(12px)}
    .copy{padding:clamp(38px,7vw,76px);display:flex;flex-direction:column;justify-content:center}
    .brand{display:flex;align-items:center;gap:20px;margin-bottom:60px}
    .brand img{width:min(100%,260px);height:auto;display:block;object-fit:contain;background:#fff;padding:7px;border-radius:2px}
    .eyebrow{font-family:Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.23em;color:var(--accent);display:flex;align-items:center;gap:12px}
    .eyebrow:before{content:"";width:28px;height:1px;background:var(--accent)}
    h1{font-size:clamp(42px,6.8vw,74px);font-weight:400;line-height:.99;letter-spacing:-.045em;margin:21px 0 18px;max-width:9ch}
    h1 em{font-style:italic;color:var(--accent)}
    .message{font-family:Arial,sans-serif;color:var(--muted);font-size:16px;line-height:1.75;max-width:34ch;margin:0}
    .status{display:flex;align-items:center;gap:11px;margin-top:36px;font:11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d6ddd7}
    .dot{width:8px;height:8px;border-radius:50%;background:#8eb68b;box-shadow:0 0 0 5px rgba(142,182,139,.13);animation:pulse 2s infinite}
    .art{position:relative;overflow:hidden;border-left:1px solid var(--line);display:grid;place-items:center;background:linear-gradient(155deg,rgba(208,161,93,.10),transparent 43%)}
    .orbit{position:absolute;width:min(74%,390px);aspect-ratio:1;border:1px solid rgba(208,161,93,.43);border-radius:50%;box-shadow:0 0 0 30px rgba(208,161,93,.025),0 0 0 72px rgba(208,161,93,.02)}
    .orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(208,161,93,.2);border-radius:50%;inset:13%;transform:rotate(45deg) scaleX(.44)}
    .orbit:after{transform:rotate(-45deg) scaleX(.44)}
    .bearing{position:relative;width:min(44%,220px);aspect-ratio:1;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 60px rgba(208,161,93,.12),inset 0 0 44px rgba(208,161,93,.06)}
    .bearing:before,.bearing:after{content:"";position:absolute;border:1px solid rgba(208,161,93,.64);border-radius:50%}
    .bearing:before{inset:17%}.bearing:after{inset:36%;background:rgba(208,161,93,.12)}
    .bearing span{z-index:1;font:10px Arial,sans-serif;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
    .caption{position:absolute;bottom:30px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.18em;color:rgba(246,245,239,.45);text-transform:uppercase}
    footer{position:fixed;bottom:19px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.12em;color:rgba(246,245,239,.43);text-transform:uppercase}
    @keyframes pulse{50%{box-shadow:0 0 0 9px rgba(142,182,139,0)}}
    @media(max-width:680px){body{padding:18px 16px 42px}.card{min-height:min(780px,calc(100vh - 60px));grid-template-columns:1fr;grid-template-rows:1fr minmax(210px,.72fr)}.copy{padding:32px 28px 24px}.brand{margin-bottom:42px}.brand img{width:220px}.art{border-left:0;border-top:1px solid var(--line)}.orbit{width:min(56%,230px)}.bearing{width:min(31%,130px)}.caption{bottom:14px}h1{max-width:10ch}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <section class="copy">
      <div class="brand"><img src="mjg-logo.jpg" alt="MJG Rodamientos S.R.L."></div>
      <div class="eyebrow">Sitio en mantenimiento</div>
      <h1 id="title">Estamos trabajando <em>para usted.</em></h1>
      <p class="message">Estamos realizando mejoras para brindarle una mejor experiencia. Volveremos a estar en línea muy pronto.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>Trabajando para volver pronto</div>
    </section>
    <aside class="art" aria-hidden="true">
      <div class="orbit"></div>
      <div class="bearing"><span>MJG · precisión</span></div>
      <div class="caption">Rodamientos · Transmisión · Industria</div>
    </aside>
  </main>
  <footer>MJG Rodamientos S.R.L.</footer>
</body>
</html>
